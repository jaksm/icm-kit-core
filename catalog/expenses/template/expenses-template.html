<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{title}}</title>
<!--ICM-FONTS-->
<style>
/*ICM-CSS*/
/* Only what is particular to this page; everything else is a primitive of the library (icm-page, icm-stack, icm-tabs, icm-card,
   icm-stat, icm-table, icm-dot, icm-bar, icm-series). State is CSS: one radio per month inside icm-tabs, no script draws
   anything, so the page still shows its numbers where scripts do not run. */
body{margin:0;background:var(--paper)}
.icm-page{--page:720px}
.panel{display:none}
.icm-table td.bar{width:34%}
tr.small th,tr.small td{color:var(--c-muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--s-4);margin:0;padding-top:var(--s-4);border-top:var(--border) solid var(--c-hairline)}
.facts dd{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:480px){.icm-table td.bar{display:none}}
__RULES__
</style>
<body class="on-paper">
<main class="icm-page"><div class="icm-stack is-loose">
<h1 class="icm-title">{{title}}</h1>
<div class="icm-tabs is-scroll" role="tablist" aria-label="{{months}}">__TABS__</div>
<div class="panels">__PANELS__</div>
</div></main>
<script>/* ?theme=dark or ?theme=light forces a theme, for a preview or a screenshot; without it the system decides */
{const t=new URLSearchParams(location.search).get('theme');if(t)document.documentElement.dataset.theme=t}</script>
<script type="module">/*ICM-JS*/</script>
