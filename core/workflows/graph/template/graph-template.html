<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ICM Graph</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=JetBrains+Mono:wght@400..700&display=swap">
<style>
/* Self-contained page in the kit's one look (Aquarium theme, Pearl palette): glass cards over two radial depths, blur behind,
   20px corners, a faint rim, no shadow. Token names are the old library's. The complete light set is on bare :root; dark is
   redefined under prefers-color-scheme (guarded so an explicit light choice wins) and again under [data-theme="dark"]. */
:root{
  color-scheme:light;
  --font-sans:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --font-display:var(--font-sans);
  --t-1:13px; --t-2:14px; --t-3:16px; --t-4:18px; --t-5:22px; --t-6:28px;
  --w-body:500; --w-strong:700; --w-loud:800; --w-ui:600;
  --stretch-title:100%; --stretch-num:100%; --track-title:-.03em; --track-num:-.04em; --lh-body:1.5;
  --gutter:16px; --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:36px; --s-7:56px; --s-8:88px;
  --radius:20px; --radius-s:12px; --border:1px; --press-x:0px; --press-y:2px; --press-blur:0px; --tap:48px;
  --card-backdrop:blur(18px) saturate(1.5);
  --ease:cubic-bezier(.2,.7,.3,1); --spring:cubic-bezier(.3,1.7,.5,1);
  --paper:#fdece6; --card:#fdfbfa; --card-fill:rgba(255,255,255,.55);
  --ink:#2e1912; --ink-2:#594139; --ink-muted:#725e57;
  --line:rgba(46,25,18,0.14); --line-soft:rgba(46,25,18,0.08);
  --accent:#923002; --accent-fill:#9f3604; --on-accent:#ffffff;
  --edge:rgba(255,255,255,.45); --edge-strong:rgba(255,255,255,.6); --press-color:transparent;
  --mark:#e3cabe; --on-mark:#2e1912;
  --state-good:#0a7736; --state-warn:#85590a; --state-bad:#a83634;
  --cat-1:#a36e09; --cat-2:#6d8602; --cat-3:#01906e; --cat-4:#1089a0; --cat-5:#4d77cc; --cat-6:#9460b7; --cat-7:#b9527b; --cat-8:#bc5a2b;
  --cat-9:#857a58; --cat-10:#6c8265; --cat-11:#58847e; --cat-12:#5c8093;
  --page-bg:radial-gradient(120% 80% at 10% 0%,hsl(40 80% 86%),transparent 60%),radial-gradient(100% 70% at 100% 30%,hsl(250 80% 88%),transparent 55%),var(--paper);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#1d100c; --card:#251d1a; --card-fill:rgba(255,255,255,.07);
  --ink:#fee0d6; --ink-2:#d3b7ad; --ink-muted:#a9938b;
  --line:rgba(254,224,214,0.14); --line-soft:rgba(254,224,214,0.08);
  --accent:#ff8255; --accent-fill:#d44f13; --on-accent:#130906;
  --edge:rgba(255,255,255,.10); --edge-strong:rgba(255,255,255,.22);
  --mark:#5e3729; --on-mark:#fee0d6;
  --state-good:#67d283; --state-warn:#efa831; --state-bad:#fe968e;
  --cat-1:#d79628; --cat-2:#96b244; --cat-3:#1ac095; --cat-4:#1ab7d6; --cat-5:#75a3fc; --cat-6:#bf8ae6; --cat-7:#e97da6; --cat-8:#ec8557;
  --cat-9:#b0a481; --cat-10:#96ac8e; --cat-11:#81afa9; --cat-12:#86abbf;
  --page-bg:radial-gradient(120% 80% at 10% 0%,hsl(40 60% 22%),transparent 60%),radial-gradient(100% 70% at 100% 30%,hsl(250 55% 20%),transparent 55%),var(--paper);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#1d100c; --card:#251d1a; --card-fill:rgba(255,255,255,.07);
  --ink:#fee0d6; --ink-2:#d3b7ad; --ink-muted:#a9938b;
  --line:rgba(254,224,214,0.14); --line-soft:rgba(254,224,214,0.08);
  --accent:#ff8255; --accent-fill:#d44f13; --on-accent:#130906;
  --edge:rgba(255,255,255,.10); --edge-strong:rgba(255,255,255,.22);
  --mark:#5e3729; --on-mark:#fee0d6;
  --state-good:#67d283; --state-warn:#efa831; --state-bad:#fe968e;
  --cat-1:#d79628; --cat-2:#96b244; --cat-3:#1ac095; --cat-4:#1ab7d6; --cat-5:#75a3fc; --cat-6:#bf8ae6; --cat-7:#e97da6; --cat-8:#ec8557;
  --cat-9:#b0a481; --cat-10:#96ac8e; --cat-11:#81afa9; --cat-12:#86abbf;
  --page-bg:radial-gradient(120% 80% at 10% 0%,hsl(40 60% 22%),transparent 60%),radial-gradient(100% 70% at 100% 30%,hsl(250 55% 20%),transparent 55%),var(--paper);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
/* the library's primitives this page uses, with the surface indirection folded away: a card, a dot, a badge, an option */
.card{background:var(--card-fill);-webkit-backdrop-filter:var(--card-backdrop);backdrop-filter:var(--card-backdrop);border:var(--border) solid var(--edge);border-radius:var(--radius);padding:var(--s-4);color:var(--ink);min-width:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--dot,var(--cat-1));flex:none}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-1);font-weight:var(--w-ui);line-height:1.5;padding:2px 8px;white-space:nowrap;color:var(--ink-2);border:var(--border) solid var(--edge);border-radius:var(--radius-s)}
.caption{font-size:var(--t-1);line-height:1.45;margin:0;color:var(--ink-muted)}
/* where the floating chrome sits over the canvas; no color in here or in the script: node colors are the --cat tokens read at draw time */
html,body{height:100%;overflow:clip}
body{margin:0;background:var(--page-bg);color:var(--ink);font:var(--w-body) var(--t-2)/1.45 var(--font-sans);font-variant-numeric:tabular-nums}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas.dragging{cursor:grabbing}
.float{position:fixed;z-index:2}
.float.card{box-shadow:var(--press-x) var(--press-y) var(--press-blur) var(--press-color);border-color:var(--edge-strong)}   /* a panel is an object over the canvas */

/* top bar: search against the left edge, icon buttons against the right, space between */
#bar{top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:100px;display:flex;align-items:flex-start}
#bar{pointer-events:none}
#bar>*{pointer-events:auto}
#searchbox{flex:none;width:min(420px,calc(100vw - 24px))}
.field{position:relative}
.field svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-muted);pointer-events:none}
#search{font:var(--w-body) var(--t-3)/1.3 var(--font-sans);min-height:var(--tap);padding:0 var(--s-3) 0 36px;width:100%;color:var(--ink);background:var(--card-fill);-webkit-backdrop-filter:var(--card-backdrop);backdrop-filter:var(--card-backdrop);border:var(--border) solid var(--edge-strong);border-radius:var(--radius);-webkit-appearance:none;transition:box-shadow .2s var(--spring)}
#search:focus{outline:0;box-shadow:0 0 0 2px var(--accent)}
#search::placeholder{color:var(--ink-muted)}
#results.card{padding:0;overflow:clip}
#results{list-style:none;margin:var(--s-2) 0 0;padding:0;max-height:65vh;overflow:auto}
#results li{padding:var(--s-2) var(--s-3);cursor:pointer;border-bottom:var(--border) solid var(--line)}
#results li:last-child{border-bottom:0}
#results li:hover{background:var(--line-soft)}
#results li[aria-selected="true"]{background:var(--mark);color:var(--on-mark);box-shadow:inset 4px 0 0 var(--on-mark);--ink-muted:var(--on-mark);--ink-2:var(--on-mark)}
#results .t{display:block;font-weight:600}
#results .p{display:block;font:400 var(--t-1)/1.5 var(--font-mono);color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#results .s{display:block;font-size:var(--t-1);color:var(--ink-2);margin-top:3px;line-height:1.4}
/* a search match is what is being read: the marker */
mark{background:var(--mark);color:var(--on-mark);padding:0 2px}

/* bottom: a full width status bar */
#stat{position:fixed;z-index:2;left:0;right:0;bottom:0;display:flex;align-items:center;flex-wrap:nowrap;gap:10px;white-space:nowrap;
  font-size:var(--t-1);color:var(--ink-muted);background:var(--card);border-top:var(--border) solid var(--edge);
  padding:3px 12px calc(3px + env(safe-area-inset-bottom,0px));min-height:30px;
  overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
#stat::-webkit-scrollbar{display:none}
#stat .total{margin-left:auto;padding-left:12px}
#stat b{font-weight:600;color:var(--ink-2)}
#stat .leg{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:var(--radius-s)}
#stat .leg:hover{background:var(--mark);color:var(--on-mark)}
#stat .leg:focus-visible{outline:2px solid var(--accent)}
#stat .leg[aria-pressed="false"]{opacity:.4}
#stat svg{color:var(--ink-muted)}
#stat .total b{color:var(--ink)}

/* right: settings */
#settings{top:calc(56px + env(safe-area-inset-top,0px));right:12px;width:270px;max-height:calc(100% - 104px);overflow:auto;padding:4px var(--s-4) var(--s-3)}
#settings .handle{display:flex;align-items:center;justify-content:space-between;cursor:grab;touch-action:none;user-select:none;padding:8px 0;font-weight:var(--w-strong)}
.iconbtn{right:12px;width:36px;height:36px;display:grid;place-items:center;
  border:var(--border) solid var(--edge-strong);border-radius:var(--radius);background:var(--card);color:var(--ink);cursor:pointer;
  box-shadow:var(--press-x) var(--press-y) var(--press-blur) var(--press-color);transition:translate .08s ease-out,box-shadow .08s ease-out}
.iconbtn:active{translate:var(--press-x) var(--press-y);box-shadow:0 0 0 var(--press-color)}
#gear{top:calc(10px + env(safe-area-inset-top,0px))}
#legend-btn{top:calc(10px + env(safe-area-inset-top,0px));right:58px}
.iconbtn[aria-expanded="true"]{background:var(--mark);color:var(--on-mark);border-color:var(--on-mark)}
.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.x{all:unset;cursor:pointer;flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:var(--radius-s);
  color:var(--ink-muted);font-size:20px;line-height:1}
.x:hover{color:var(--on-mark);background:var(--mark)}
.x:focus-visible{outline:2px solid var(--accent)}
#colors{top:calc(56px + env(safe-area-inset-top,0px));right:12px;width:230px;max-height:calc(100% - 104px);overflow:auto;padding:var(--s-2)}
#colors button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;padding:4px 8px;border-radius:var(--radius-s);font-size:var(--t-1)}
#colors button:hover{background:var(--line-soft)}
#colors button:focus-visible{outline:2px solid var(--accent)}
#colors button[aria-pressed="false"]{opacity:.4}
#colors .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
#colors .count{color:var(--ink-muted)}
details{border-top:var(--border) solid var(--line);padding:6px 0}
summary{cursor:pointer;color:var(--ink);font-weight:600;padding:4px 0;font-size:var(--t-1)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0;font-size:var(--t-1)}
.row label{display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0}
.row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .count{color:var(--ink-muted)}
input[type=checkbox]{accent-color:var(--accent-fill);width:16px;height:16px}
input[type=range]{accent-color:var(--accent-fill)}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:6px 0;font-size:var(--t-1)}
.slider input{grid-column:1/3;width:100%}
.buttons{display:flex;gap:6px;margin:4px 0 2px}
.option{font:var(--w-ui) var(--t-3)/1.2 var(--font-sans);min-height:var(--tap);padding:0 var(--s-4);white-space:nowrap;cursor:pointer;color:var(--ink);background:var(--card-fill);border:var(--border) solid var(--edge-strong);border-radius:var(--radius);transition:background-color .12s var(--ease)}
.option:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.buttons .option{min-height:32px;font-size:var(--t-1);padding:0 var(--s-3)}

/* bottom left: the selected node */
#info{left:12px;bottom:calc(44px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 24px));max-height:46vh;overflow:auto}
#info h2{font-size:var(--t-4);font-weight:var(--w-strong);letter-spacing:-.01em;line-height:1.25;margin:0 0 4px;text-wrap:balance}
#info .path{font:400 var(--t-1)/1.5 var(--font-mono);color:var(--ink-muted);word-break:break-all;margin:0 0 8px}
#info .meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
#info h3{font-size:var(--t-1);font-weight:600;color:var(--ink-2);margin:10px 0 2px}
#info ul{list-style:none;margin:0;padding:0}
#info li{border-bottom:var(--border) solid var(--line)}#info li:last-child{border-bottom:0}
#info li button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:var(--t-2);width:100%}
#info li button:hover,#info li button:focus-visible{background:var(--mark);color:var(--on-mark)}
#info .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#info .handle{display:flex;align-items:flex-start;gap:8px;cursor:grab;touch-action:none;user-select:none}
#info .handle h2{flex:1}
#info .x{margin:-3px -6px 0 0}

#tip{position:fixed;z-index:3;pointer-events:none;background:var(--ink);color:var(--paper);font-size:var(--t-1);
  padding:5px 8px;border-radius:var(--radius-s);max-width:320px}
#tip .p{opacity:.75;font-family:var(--font-mono)}

@media (max-width:640px){
  #legend-btn{display:none}
  #settings{top:calc(60px + env(safe-area-inset-top,0px));left:12px;right:12px;width:auto}
  #colors{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

<body>
<canvas id="c" aria-label="{{canvas}}"></canvas>

<div id="bar" class="float">
<div id="searchbox">
  <div class="field">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search"  type="search" placeholder="{{search}}" autocomplete="off" aria-controls="results" aria-label="{{searchLabel}}">
  </div>
  <ul id="results" class="card" role="listbox" hidden></ul>
</div>

</div>
<div id="stat" aria-live="polite"></div>

<button id="gear" class="float iconbtn" aria-label="{{settings}}" aria-expanded="false" aria-controls="settings">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>
<button id="legend-btn" class="float iconbtn" aria-label="{{legend}}" aria-expanded="true" aria-controls="colors">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><circle cx="8" cy="16" r="3"/><circle cx="16" cy="16" r="3"/></svg>
</button>
<div id="colors" class="float card" aria-label="{{colors}}"></div>
<div id="settings" class="float card" hidden>
  <div class="handle"><span>{{settings}}</span><button class="x" id="settings-x" aria-label="{{closeSettings}}">×</button></div>
  <div class="content">
    <details open>
      <summary>{{filters}}</summary>
      <div class="buttons"><button class="option" id="all-on">{{all}}</button><button class="option" id="no-archive">{{noArchive}}</button></div>
      <div id="groups"></div>
      <div class="row"><label><input type="checkbox" id="orphans" checked> <span>{{orphans}}</span></label><span class="count" id="orphan-count"></span></div>
      <div id="statuses"></div>
    </details>
    <details open>
      <summary>{{display}}</summary>
      <div class="row"><label><input type="checkbox" id="arrows"> <span>{{arrows}}</span></label></div>
      <div class="slider"><span>{{nameThreshold}}</span><span id="v-threshold"></span><input type="range" id="threshold" min="1" max="8" step="0.1" value="3.1"></div>
      <div class="slider"><span>{{nodeSize}}</span><span id="v-size"></span><input type="range" id="size" min="0.5" max="3" step="0.1" value="1"></div>
      <div class="slider"><span>{{lineWidth}}</span><span id="v-stroke"></span><input type="range" id="stroke" min="0.2" max="3" step="0.1" value="1"></div>
    </details>
    <details open>
      <summary>{{forces}}</summary>
      <div class="slider"><span>{{centering}}</span><span id="v-center"></span><input type="range" id="center" min="0" max="0.3" step="0.01" value="0.05"></div>
      <div class="slider"><span>{{repulsion}}</span><span id="v-repel"></span><input type="range" id="repel" min="0" max="400" step="5" value="80"></div>
      <div class="slider"><span>{{linkPull}}</span><span id="v-pull"></span><input type="range" id="pull" min="0" max="1" step="0.02" value="0.3"></div>
      <div class="slider"><span>{{linkLength}}</span><span id="v-dist"></span><input type="range" id="dist" min="5" max="200" step="5" value="40"></div>
    </details>
  </div>
</div>

<div id="info" class="float card" hidden></div>
<div id="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>

<script>
const D = __DATA__;
const $ = s => document.querySelector(s);
const TYPES = ["Reference","Output","Decision","Skill","Tracking","Architecture","Research","Context","Untyped"];
// invariant: no color in this script. A group gets a SLOT of the categorical ramp (--cat-1..8 by size, the grey tail
// --cat-9..12 for the archive); the DOM uses the token itself, the canvas reads its value at draw time, so both follow the theme.

// A color belongs to a group and is given once: groups by size, the archive in grey tail colors.
const groupCount = d3.rollup(D.n, v => v.length, d => d.g);
const groupOrder = [...groupCount.keys()].sort((a, b) => {
  const aa = a.startsWith("{{archive}}"), bb = b.startsWith("{{archive}}");
  return aa - bb || groupCount.get(b) - groupCount.get(a) || a.localeCompare(b);
});
const slot = new Map(); let ip = 0, ir = 0;
for (const g of groupOrder) slot.set(g, g.startsWith("{{archive}}") ? 9 + ir++ % 4 : 1 + ip++ % 8);
const color = {get: g => `var(--cat-${slot.get(g)})`};   // for the DOM
let cats = [];                                            // for the canvas, refreshed in draw()

const nodeById = new Map(D.n.map(n => [n.id, n]));
const links = D.e.map(([s, t]) => ({source: s, target: t}));
const neighbors = new Map(D.n.map(n => [n.id, {out: [], inc: []}]));
for (const [s, t] of D.e) { neighbors.get(s).out.push(t); neighbors.get(t).inc.push(s); }

const store = { read(k, d) { try { const v = localStorage.getItem("graph:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  write(k, v) { try { localStorage.setItem("graph:" + k, JSON.stringify(v)); } catch {} } };

const state = {
  groups: new Set(store.read("groups", groupOrder)),
  statuses: new Set(store.read("statuses", ["active","draft","paused","archived",""])),
  shapes: new Set(store.read("shapes", ["square","diamond","triangle","circle","ring"])),
  orphans: true, arrows: false, selected: null, hover: null,
};

// ---------- controls ----------
function row(name, count, dotColor, checked, onChange) {
  const d = document.createElement("div"); d.className = "row";
  const l = document.createElement("label");
  const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = checked;
  cb.addEventListener("change", () => onChange(cb.checked));
  l.append(cb);
  if (dotColor) { const t = document.createElement("span"); t.className = "dot"; t.style.background = dotColor; l.append(t); }
  const s = document.createElement("span"); s.className = "name"; s.textContent = name; l.append(s);
  const b = document.createElement("span"); b.className = "count"; b.textContent = count;

let visible = new Set(), beforeShape = [];

// Shape by type; the status bar doubles as the shape legend.

const shapeOf = n => SHAPE[n.ty] || "circle";
const LEGEND = [["square", "Skill", n => n.ty === "Skill"], ["diamond", "Decision", n => n.ty === "Decision"],
  ["triangle", "Context", n => n.ty === "Context"], ["circle", "{{legendRecord}}", n => shapeOf(n) === "circle"], ["ring", "{{legendUntyped}}", n => n.ty === "Untyped"]];
const ICON = {circle: '<circle cx="6" cy="6" r="4.5"/>', square: '<rect x="2" y="2" width="8" height="8"/>',
  diamond: '<path d="M6 1 11 6 6 11 1 6Z"/>', triangle: '<path d="M6 1.5 11 10.5H1Z"/>',

function item(id) {

// Search: exact substring over title, path, tags, description and the full text, ignoring case and

const fold = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\u0111/g, "d");

    while ((x = n._b.indexOf(nq, from)) >= 0 && positions.length < 50) { positions.push(x); from = x + nq.length; }
    if (n._t.includes(nq)) score += 100;
    if (n._id.includes(nq)) score += 40;
    if (n._tg.includes(nq)) score += 20;
    score += Math.min(positions.length, 20);
    if (score) hits.push({n, score, positions});
  }
  hits.sort((a, b) => b.score - a.score || a.n.t.localeCompare(b.n.t));

}

    frag.append(text.slice(from, x)); const m = document.createElement("mark"); m.textContent = text.slice(x, x + nq.length); frag.append(m); from = x + nq.length;

let found = [], activeIdx = 0;
function showResults() {

    li.onmousedown = e => { e.preventDefault(); select(n.id, true); ul.hidden = true; };
